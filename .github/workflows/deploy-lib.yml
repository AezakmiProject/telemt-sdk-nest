name: Deploy lib

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  send-start-deploy-telegram-message:
    name: Send Telegram message
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🏹 Deploy ${{ github.repository }} npm package has started
            tag: ${{ github.ref_name }}
            commit: ${{ github.sha }}
            actor: ${{ github.actor }}

  build:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version from git tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "Tag must be v<semver>, got ${GITHUB_REF_NAME}"
            exit 1
          fi
          pnpm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Publishing @aezakmiproject/telemt-sdk-nest@$VERSION"

      - name: Publish package on NPM
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  send-telegram-message:
    name: Send Telegram message
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ✅ ${{ github.repository }} npm package published
            package: @aezakmiproject/telemt-sdk-nest@${{ github.ref_name }}
            commit: ${{ github.sha }}
            actor: ${{ github.actor }}

  notify-on-error:
    runs-on: ubuntu-latest
    needs: [ci, build]
    if: ${{ always() && (needs.ci.result == 'failure' || needs.build.result == 'failure') }}
    steps:
      - name: Send error notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ❌ ${{ github.repository }} npm publish failed
            tag: ${{ github.ref_name }}
            commit: ${{ github.sha }}
            actor: ${{ github.actor }}
